# ------------------------------------------------------------
# SITE SETTINGS: edit the three lines marked CHANGE ME.
# ------------------------------------------------------------

title: "Sample Archive"          # CHANGE ME: the name of your archive
team: "The whole dang class"                  # CHANGE ME: your team name
description: "One sentence about what this archive collects and why."
course: "DH 150, UCLA"
accent_color: "#0b5d7a"                # optional: any hex color for links and buttons

# IMPORTANT. CHANGE ME: put a slash, then your repository name exactly.
# Example: if your repository is called dh150-red-team, write "/dh150-red-team"
baseurl: "/dh-150-test"
url: ""

# ------------------------------------------------------------
# Everything below can be left alone.
# ------------------------------------------------------------

nav:
  - title: Artifacts
    url: /artifacts/
  - title: Analyses
    url: /analyses/
  - title: Argument
    url: /paper/
  - title: About
    url: /about/

collections:
  artifacts:
    output: true
    permalink: /artifacts/:name/
  analyses:
    output: true
    permalink: /analyses/:name/

defaults:
  - scope:
      path: ""
      type: artifacts
    values:
      layout: artifact
  - scope:
      path: ""
      type: analyses
    values:
      layout: analysis

markdown: kramdown
exclude:
  - README.md
